<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    li { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
    li.done span { text-decoration: line-through; color: #888; }
    #empty { color: #888; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Task List</h1>

  <form id="new-task-form">
    <input id="new-task-input" placeholder="What needs doing?" autocomplete="off">
    <button type="submit" data-testid="add-button">Add</button>
  </form>

  <p id="empty" data-testid="empty-state">No tasks yet.</p>
  <ul id="task-list" data-testid="task-list"></ul>
  <p data-testid="counter"><span id="remaining">0</span> remaining</p>

<script>
  const tasks = [];
  const list = document.getElementById('task-list');
  const empty = document.getElementById('empty');

  function render() {
    list.innerHTML = '';
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      li.dataset.testid = 'task-item';
      if (task.done) li.classList.add('done');
      li.innerHTML =
        `<input type="checkbox" data-testid="toggle" ${task.done ? 'checked' : ''}>` +
        `<span data-testid="task-title">${task.title}</span>` +
        `<button data-testid="delete">x</button>`;
      li.querySelector('[data-testid=toggle]').addEventListener('change', () => {
        tasks[i].done = !tasks[i].done;
        render();
      });
      li.querySelector('[data-testid=delete]').addEventListener('click', () => {
        tasks.splice(i, 1);
        render();
      });
      list.appendChild(li);
    });
    empty.classList.toggle('hidden', tasks.length > 0);
    document.getElementById('remaining').textContent =
      tasks.filter((t) => !t.done).length;
  }

  document.getElementById('new-task-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('new-task-input');
    const title = input.value.trim();
    if (!title) return;              // empty input is rejected
    tasks.push({ title, done: false });
    input.value = '';
    render();
  });

  render();
</script>
</body>
</html>
